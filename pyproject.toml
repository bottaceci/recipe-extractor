[project]
name = "recipe-extractor-old"
version = "0.1.0"
description = "App to extract recipes and ingredients from cooking blogs through ML"
readme = "README.md"
authors = [
    { name = "Cecilia Botta" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
ml = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "evaluate>=0.4.6",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
    "transformers>=5.12.0",
]
